<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js Single Page Application</title>
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <div class="nav-bar"></div>

        <div class="product-display">
            <div class="product-container">
                <div class="product-image">
                    <img v-bind:src="image" alt="">
                </div>

                <div class="product-info">
                    <h1>{{ product }}</h1>
                    <p>{{ description }}</p>
                    <ul>
                        <li v-for="detail in details">{{ detail }}</li>
                    </ul>
                    <a :href="url">WIFI Website</a>
                    <p v-if="inventory > 10">auf Lager</p>
                    <p v-else-if="inventory <= 10 && inventory > 0">nur wenige Artikel lagernd</p>
                    <p v-else>ausverkauft</p>
                    <p v-show="onSale">Angebot!</p>
                    <div v-for="variant in variants" :key="variant.id">{{ variant.color }}</div>
                </div>
            </div>
        </div>
    </div>


    <script src="./main.js"></script>

    <script>
        const mountedApp = app.mount('#app')
    </script>
</body>

</html>

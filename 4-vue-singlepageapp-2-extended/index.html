<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue.js Single Page Application</title>
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <div class="nav-bar"></div>

        <div class="cart">Warenkorb({{ cart }})</div>

        <div class="product-display">
            <div class="product-container">
                <div class="product-image">
                    <img v-bind:src="image" alt="">
                </div>

                <div class="product-info">
                    <h1>{{ title }}</h1>
                    <p>{{ description }}</p>
                    <ul>
                        <li v-for="detail in details">{{ detail }}</li>
                    </ul>
                    <a :href="url">WIFI Website</a>
                    <p v-if="inStock > 10">auf Lager</p>
                    <p v-else-if="inStock <= 10 && inStock > 0">nur wenige Artikel lagernd</p>
                    <p v-else>ausverkauft</p>
                    <p v-show="onSale">{{ sale }}</p>
                    <div 
                        v-for="(variant, index) in variants" 
                        :key="variant.id" 
                        @mouseover="updateVariant(index)"
                        class="color-circle"
                        :style="{ backgroundColor: variant.color }">
                    </div>
                    <button 
                        class="button"
                        :class="{ disabledButton: !inStock }"
                        :disabled="!inStock"
                        @click="addToCart">
                        einkaufen
                    </button>
                    <button class="button" v-on:click="removeFromCart">Artikel entfernen</button>
                </div>
            </div>
        </div>
    </div>


    <script src="./main.js"></script>

    <script>
        const mountedApp = app.mount('#app')
    </script>
</body>

</html>
